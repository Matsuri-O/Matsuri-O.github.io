# ===== 資料（ダウンロード）=====
# type       : 種別（【】の中に表示。例: 尺度 / 授業資料 / スライド）
# title      : 資料タイトル
# preview    : プレビュー画像（assets/img/materials/ に置く。PDFの1ページ目を画像にしたものなど）
#              書かなければ「PDF」などの文字が入った枠を表示します
# description: 資料の説明（何をするためのものか）。改行せず1行で
# source     : 出典。APA第7版の書誌情報、または授業名など。*アスタリスク* で斜体
# files      : ダウンロードするファイル（assets/files/ に置く）。複数可
# ※ 以下は記入例です（架空の文献・DOI）。

- type: "尺度"
  title: "日本語版肯定的摂食尺度（The Japanese version of the Positive Eating Scale; PES-J）"
  preview: /assets/img/materials/pes-j.png
  description: "自らの摂食についての評価傾向を測る8項目2因子・4件法の質問紙です。採点方法と項目の並び順は質問票の記載をご参照ください。"
  source: >-
    Okamoto, M., Oshio, A., Renner, B., & Sproesser, G. (2026).
    The Japanese version of the Positive Eating Scale (PES-J):
    Psychometric evaluation and relationship with health parameters.
    *Journal of Health Psychology*. Advance online publication.
    <https://doi.org/10.1177/13591053261437584>
  files:
    - path: /assets/files/PESJ.pdf
      format: pdf
