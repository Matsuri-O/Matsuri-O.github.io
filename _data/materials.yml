# ===== 資料（ダウンロード）=====
# type       : 種別（【】の中に表示。例: 尺度 / 授業資料 / スライド）
# title      : 資料タイトル
# preview    : プレビュー画像（assets/img/materials/ に置く。PDFの1ページ目を画像にしたものなど）
#              書かなければ「PDF」などの文字が入った枠を表示します
# description: 資料の説明（何をするためのものか）。改行せず1行で
# source     : 出典。APA第7版の書誌情報、または授業名など。*アスタリスク* で斜体
# files      : ダウンロードするファイル（assets/files/ に置く）。複数可
# ※ 以下は記入例です（架空の文献・DOI）。

- type: 尺度
  title: 〇〇尺度（Example Scale; ES）
  preview: /assets/img/materials/example-scale.png
  description: 大学生の〇〇の程度を測る12項目・5件法の質問紙です。採点方法と項目の並び順は、質問票の2ページ目に従ってください。
  source: >-
    Yamada, T., & Suzuki, H. (2025). Development and validation of the
    Example Scale for university students. *Japanese Journal of Example
    Psychology*, *12*(3), 45–60. https://doi.org/10.0000/example.0001
  files:
    - path: /assets/files/example-scale.pdf
      format: pdf

- type: 授業資料
  title: 心理統計入門 第3回「平均と散らばり」
  preview: /assets/img/materials/stats-lecture-03.png
  description: 平均値・標準偏差の考え方を、手計算の例題で確かめるための配布資料です。
  source: 〇〇大学「心理統計法Ⅰ」2025年度前期
  files:
    - path: /assets/files/stats-lecture-03.pdf
      format: pdf
