---
layout: default
---
{% assign profile = site.data.profile %}
<section class="home-landing" aria-labelledby="home-title">
  <h1 class="home-title" id="home-title">魚拓用サイト</h1>
  <ul class="home-links">
    {% for l in profile.links %}
    <li><a href="{{ l.url }}" rel="noopener">{{ l.label }}</a></li>
    {% endfor %}
  </ul>
</section>

<ul class="cards cards-top">
  <li class="card">
    <a href="{{ '/information/' | relative_url }}">
      <span class="card-en">PROFILE</span>
      <span class="card-ja">所属・経歴・連絡先</span>
    </a>
  </li>
  <li class="card">
    <a href="{{ '/research/' | relative_url }}">
      <span class="card-en">RESEARCH</span>
      <span class="card-ja">論文・発表・資料</span>
    </a>
  </li>
  <li class="card">
    <a href="{{ '/other/' | relative_url }}">
      <span class="card-en">OTHER</span>
      <span class="card-ja">これまでに携わったもの</span>
    </a>
  </li>
</ul>
